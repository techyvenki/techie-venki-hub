name: Update tech news

# Runs daily, fetches feeds, and commits docs/_data/tech_news.yml if it changed.
# No secrets required — this is pure RSS/Atom fetching, no LLM call.
#
# Also runnable by hand from the Actions tab (workflow_dispatch) — useful
# right after you edit docs/scripts/news_config.yaml and want the site to pick
# it up immediately instead of waiting for the next scheduled run.

on:
  schedule:
    # 11:00 UTC daily ≈ 6-7am US Eastern, adjust to taste.
    - cron: "0 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: tech-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser pyyaml

      - name: Fetch and rank
        run: python docs/scripts/news_fetch.py --verbose

      - name: Commit if changed
        run: |
          if git diff --quiet -- docs/_data/tech_news.yml; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/_data/tech_news.yml
          git commit -m "news: daily refresh"
          git fetch origin main
          if ! git rebase origin/main; then
            echo "Rebase failed (likely another run updated the same file). Skipping push."
            git rebase --abort || true
            exit 0
          fi
          git push origin HEAD:main
