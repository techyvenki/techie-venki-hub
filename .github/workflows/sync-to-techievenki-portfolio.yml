name: Sync to Techievenki Portfolio

on:
  push:
    branches:
      - main  # Change to 'master' if that's your default branch
      - gh-pages  # If you're using gh-pages branch

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.OMNISTACK_TOKEN }}
          lfs: true

      - name: Checkout LFS objects
        run: git lfs pull

      - name: Push to techievenki portfolio repository
        env:
          OMNISTACK_TOKEN: ${{ secrets.OMNISTACK_TOKEN }}
        run: |
          # Configure git
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          # Add the techievenki portfolio repo as a remote.
          git remote add techievenki https://x-access-token:${OMNISTACK_TOKEN}@github.com/techyvenki/omnistack.git
          
          # Publish only the current snapshot, not the source repository history.
          # This prevents secrets from older source commits being sent to the destination.
          snapshot_commit="$(git commit-tree HEAD^{tree} -m "Sync snapshot from techie-venki-hub")"
          git push techievenki "$snapshot_commit:refs/heads/main" --force
          
          echo "✅ Successfully synced to omnistack repository!"
