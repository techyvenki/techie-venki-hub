name: Sync to Techievenki Portfolio

on:
  push:
    branches:
      - main  # Change to 'master' if that's your default branch
      - gh-pages  # If you're using gh-pages branch

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.OMNISTACK_TOKEN }}
          lfs: true  # Add this line to fetch LFS files

      - name: Checkout LFS objects
        run: git lfs pull  # Ensure all LFS objects are downloaded

      - name: Push to techievenki portfolio repository
        env:
          OMNISTACK_TOKEN: ${{ secrets.OMNISTACK_TOKEN }}
        run: |
          set -euo pipefail

          # Configure git
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

          # Create a clean snapshot commit so old history with blocked secrets is not mirrored.
          export_dir="$(mktemp -d)"
          rsync -a --delete --exclude='.git' ./ "${export_dir}/"

          git init --initial-branch=main "${export_dir}"
          git -C "${export_dir}" config user.name "GitHub Actions Bot"
          git -C "${export_dir}" config user.email "actions@github.com"
          git -C "${export_dir}" lfs install --local

          git -C "${export_dir}" add --all
          git -C "${export_dir}" commit -m "Sync from techie-venki-hub"

          # Push the current snapshot to the portfolio repo (force push to keep them identical).
          git -C "${export_dir}" \
            -c "url.https://x-access-token:${OMNISTACK_TOKEN}@github.com/.insteadOf=https://github.com/" \
            push https://github.com/techyvenki/omnistack.git HEAD:main --force
          
          echo "✅ Successfully synced to omnistack repository!"
